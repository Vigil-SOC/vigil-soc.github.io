title: Vigil SOC
description: AI-native Security Operations — Open Source AI SOC
url: "https://vigilsoc.org"
baseurl: ""

permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Jekyll ignores dotfiles by default; .well-known must be explicitly included
# so https://vigilsoc.org/.well-known/security.txt is published (RFC 9116).
include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - CONTRIBUTING.md
  - "*.sh"

defaults:
  - scope:
      path: "docs"
    values:
      layout: docs
