<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="'Space Grotesk','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img"><title>MCP authorization hardening: OAuth 2.1 and OIDC alignment, RFC 9207 issuer validation, CIMD, issuer-bound credentials.</title><rect x="1" y="1" width="878" height="428" rx="16" fill="#f7f5ee" stroke="#ddd9cb" stroke-width="1.5"/><defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a4a991"/></marker></defs><text x="40" y="46" font-size="12.5" fill="#486724" font-weight="700" text-anchor="start" letter-spacing="2">MCP · AUTHORIZATION HARDENING</text><text x="40" y="76" font-size="24" fill="#1f1f21" font-weight="700" text-anchor="start">Aligned with OAuth 2.1 / OIDC</text><line x1="40" y1="94" x2="840" y2="94" stroke="#ddd9cb" stroke-width="1.5"/><rect x="60" y="150" width="210" height="74" rx="12" fill="#ffffff" stroke="#6e7d94" stroke-width="2"/><text x="165.0" y="182" font-size="15.5" fill="#1f1f21" font-weight="700" text-anchor="middle">MCP client</text><text x="165.0" y="204" font-size="12" fill="#52534b" font-weight="500" text-anchor="middle">declares app_type via CIMD</text><rect x="335.0" y="150" width="210" height="74" rx="12" fill="#ffffff" stroke="#364c16" stroke-width="2"/><text x="440.0" y="182" font-size="15.5" fill="#1f1f21" font-weight="700" text-anchor="middle">Authorization server</text><text x="440.0" y="204" font-size="12" fill="#52534b" font-weight="500" text-anchor="middle">OpenID Connect</text><rect x="610" y="150" width="210" height="74" rx="12" fill="#ffffff" stroke="#486724" stroke-width="2"/><text x="715.0" y="182" font-size="15.5" fill="#1f1f21" font-weight="700" text-anchor="middle">Vigil MCP server</text><text x="715.0" y="204" font-size="12" fill="#52534b" font-weight="500" text-anchor="middle">stateless, per-request</text><path d="M270 187.0 L335.0 187.0" stroke="#a4a991" stroke-width="2.5" marker-end="url(#ar2)"/><text x="302.5" y="173.0" font-size="11.5" fill="#34343a" font-weight="600" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">authorize</text><path d="M545.0 187.0 L610 187.0" stroke="#a4a991" stroke-width="2.5" marker-end="url(#ar2)"/><text x="577.5" y="209.0" font-size="11.5" fill="#34343a" font-weight="600" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">bound token</text><line x1="40" y1="262" x2="840" y2="262" stroke="#ddd9cb" stroke-width="1.5"/><text x="40" y="288" font-size="14" fill="#486724" font-weight="700" text-anchor="start">What got hardened</text><circle cx="49.0" cy="315" r="9" fill="#cfd5c2"/><path d="M45.0 315 l3 3 l6 -7" stroke="#364c16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68.0" y="320" font-size="13" fill="#34343a" font-weight="500" text-anchor="start">RFC 9207 issuer validation — blunts mix-up attacks</text><circle cx="469.0" cy="315" r="9" fill="#cfd5c2"/><path d="M465.0 315 l3 3 l6 -7" stroke="#364c16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="488.0" y="320" font-size="13" fill="#34343a" font-weight="500" text-anchor="start">CIMD replaces Dynamic Client Registration</text><circle cx="49.0" cy="355" r="9" fill="#cfd5c2"/><path d="M45.0 355 l3 3 l6 -7" stroke="#364c16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="68.0" y="360" font-size="13" fill="#34343a" font-weight="500" text-anchor="start">Credentials bound to their issuing server</text><circle cx="469.0" cy="355" r="9" fill="#cfd5c2"/><path d="M465.0 355 l3 3 l6 -7" stroke="#364c16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="488.0" y="360" font-size="13" fill="#34343a" font-weight="500" text-anchor="start">Clear refresh-token &amp; step-up scope rules</text></svg>
