<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" font-family="'Space Grotesk','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img"><title>Stateless MCP core in Kubernetes: clients send self-contained requests through a plain round-robin load balancer to any of several identical stateless Vigil pods; no sticky sessions or ingress persistence.</title><rect x="1" y="1" width="878" height="448" rx="16" fill="#f7f5ee" stroke="#ddd9cb" stroke-width="1.5"/><defs><marker id="ar3" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#a4a991"/></marker></defs><text x="40" y="46" font-size="12.5" fill="#486724" font-weight="700" text-anchor="start" letter-spacing="2">STATELESS CORE · DEPLOY</text><text x="40" y="76" font-size="24" fill="#1f1f21" font-weight="700" text-anchor="start">Drop-in Kubernetes, no session gymnastics</text><line x1="40" y1="94" x2="840" y2="94" stroke="#ddd9cb" stroke-width="1.5"/><rect x="50" y="150" width="150" height="120" rx="12" fill="#ffffff" stroke="#6e7d94" stroke-width="2"/><text x="125" y="182" font-size="15" fill="#1f1f21" font-weight="700" text-anchor="middle">Clients</text><text x="125" y="206" font-size="11" fill="#52534b" font-weight="500" text-anchor="middle">each request carries</text><rect x="62" y="216" width="126" height="18" rx="9" fill="#6e7d94"/><text x="125.0" y="228.5" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">protocol version</text><rect x="62" y="238" width="126" height="18" rx="9" fill="#6e7d94"/><text x="125.0" y="250.5" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">identity + caps</text><rect x="300" y="168" width="170" height="84" rx="12" fill="#364c16" stroke="#25340e" stroke-width="2"/><text x="385" y="200" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">Load balancer</text><text x="385" y="222" font-size="12" fill="#cfd5c2" font-weight="600" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">plain round-robin</text><path d="M200 210 L300 210" stroke="#a4a991" stroke-width="2.5" marker-end="url(#ar3)"/><rect x="600" y="120" width="210" height="46" rx="12" fill="#ffffff" stroke="#486724" stroke-width="1.8"/><circle cx="622" cy="143.0" r="7" fill="#cfd5c2"/><text x="640" y="148.0" font-size="13.5" fill="#25340e" font-weight="700" text-anchor="start">Vigil pod 1</text><rect x="740" y="133.0" width="60" height="20" rx="9" fill="#486724"/><text x="770.0" y="146.5" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle">stateless</text><path d="M470 210 C 560 210, 560 143.0, 600 143.0" fill="none" stroke="#a4a991" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar3)"/><rect x="600" y="180" width="210" height="46" rx="12" fill="#ffffff" stroke="#486724" stroke-width="1.8"/><circle cx="622" cy="203.0" r="7" fill="#cfd5c2"/><text x="640" y="208.0" font-size="13.5" fill="#25340e" font-weight="700" text-anchor="start">Vigil pod 2</text><rect x="740" y="193.0" width="60" height="20" rx="9" fill="#486724"/><text x="770.0" y="206.5" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle">stateless</text><path d="M470 210 C 560 210, 560 203.0, 600 203.0" fill="none" stroke="#a4a991" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar3)"/><rect x="600" y="240" width="210" height="46" rx="12" fill="#ffffff" stroke="#486724" stroke-width="1.8"/><circle cx="622" cy="263.0" r="7" fill="#cfd5c2"/><text x="640" y="268.0" font-size="13.5" fill="#25340e" font-weight="700" text-anchor="start">Vigil pod 3</text><rect x="740" y="253.0" width="60" height="20" rx="9" fill="#486724"/><text x="770.0" y="266.5" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle">stateless</text><path d="M470 210 C 560 210, 560 263.0, 600 263.0" fill="none" stroke="#a4a991" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar3)"/><rect x="600" y="300" width="210" height="46" rx="12" fill="#ffffff" stroke="#486724" stroke-width="1.8"/><circle cx="622" cy="323.0" r="7" fill="#cfd5c2"/><text x="640" y="328.0" font-size="13.5" fill="#25340e" font-weight="700" text-anchor="start">Vigil pod 4</text><rect x="740" y="313.0" width="60" height="20" rx="9" fill="#486724"/><text x="770.0" y="326.5" font-size="10" fill="#ffffff" font-weight="600" text-anchor="middle">stateless</text><path d="M470 210 C 560 210, 560 323.0, 600 323.0" fill="none" stroke="#a4a991" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar3)"/><text x="705.0" y="368" font-size="12.5" fill="#52534b" font-weight="600" text-anchor="middle">any pod serves any request</text><line x1="40" y1="392" x2="840" y2="392" stroke="#ddd9cb" stroke-width="1.5"/><rect x="40.0" y="406" width="256.0" height="30" rx="8" fill="#cfd5c2" stroke="#cfd5c2" stroke-width="0"/><text x="168.0" y="425" font-size="13" fill="#25340e" font-weight="700" text-anchor="middle">✓ No sticky sessions</text><rect x="312.0" y="406" width="256.0" height="30" rx="8" fill="#cfd5c2" stroke="#cfd5c2" stroke-width="0"/><text x="440.0" y="425" font-size="13" fill="#25340e" font-weight="700" text-anchor="middle">✓ No ingress persistence</text><rect x="584.0" y="406" width="256.0" height="30" rx="8" fill="#cfd5c2" stroke="#cfd5c2" stroke-width="0"/><text x="712.0" y="425" font-size="13" fill="#25340e" font-weight="700" text-anchor="middle">✓ Scale · drain · roll freely</text></svg>
