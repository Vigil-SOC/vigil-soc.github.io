<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" font-family="'Space Grotesk','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img"><title>MCP 12-month deprecation window: features deprecated on July 28, 2026 keep working until at least July 28, 2027.</title><rect x="1" y="1" width="878" height="378" rx="16" fill="#f7f5ee" stroke="#ddd9cb" stroke-width="1.5"/><text x="40" y="46" font-size="12.5" fill="#486724" font-weight="700" text-anchor="start" letter-spacing="2">MCP · FEATURE LIFECYCLE POLICY</text><text x="40" y="76" font-size="24" fill="#1f1f21" font-weight="700" text-anchor="start">A 12-month deprecation window</text><line x1="40" y1="94" x2="840" y2="94" stroke="#ddd9cb" stroke-width="1.5"/><line x1="130" y1="210" x2="750" y2="210" stroke="#ddd9cb" stroke-width="4" stroke-linecap="round"/><rect x="130" y="201" width="620" height="18" rx="9" fill="#cfd5c2"/><text x="440.0" y="188" font-size="13.5" fill="#25340e" font-weight="700" text-anchor="middle">deprecated features keep working — at least 12 months</text><circle cx="130" cy="210" r="9" fill="#a14a2a"/><text x="130" y="150" font-size="15" fill="#1f1f21" font-weight="700" text-anchor="middle">Jul 28, 2026</text><text x="130" y="168" font-size="12.5" fill="#52534b" font-weight="500" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">spec 2026-07-28 published</text><rect x="40" y="252" width="300" height="92" rx="12" fill="#ffffff" stroke="#ddd9cb" stroke-width="1.5"/><text x="55" y="276" font-size="13" fill="#a14a2a" font-weight="700" text-anchor="start">Deprecated (still functional):</text><text x="55" y="298" font-size="12.5" fill="#34343a" font-weight="500" text-anchor="start">• Roots · Sampling · Logging</text><text x="55" y="318" font-size="12.5" fill="#34343a" font-weight="500" text-anchor="start">• legacy HTTP + SSE transport</text><circle cx="750" cy="210" r="9" fill="#364c16"/><text x="750" y="150" font-size="15" fill="#1f1f21" font-weight="700" text-anchor="middle">Jul 28, 2027</text><text x="750" y="168" font-size="12.5" fill="#52534b" font-weight="500" text-anchor="middle" font-family="'Martian Mono',ui-monospace,Menlo,Consolas,monospace">earliest possible removal</text><rect x="540" y="252" width="300" height="92" rx="12" fill="#ffffff" stroke="#ddd9cb" stroke-width="1.5"/><text x="555" y="276" font-size="13" fill="#364c16" font-weight="700" text-anchor="start">Predictable off-ramp:</text><text x="555" y="298" font-size="12.5" fill="#34343a" font-weight="500" text-anchor="start">• clear timelines, no surprise removals</text><text x="555" y="318" font-size="12.5" fill="#34343a" font-weight="500" text-anchor="start">• migrate on your own schedule</text></svg>
