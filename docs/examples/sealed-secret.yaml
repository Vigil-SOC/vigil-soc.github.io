# Example SealedSecret for Vigil.
#
# Flow: start from a plain Secret (see the commented example below), then
# seal it with `kubeseal -o yaml < plain.yaml > sealed.yaml`. The sealed
# output is safe to commit to git — only the SealedSecrets controller in
# the target cluster can decrypt it.
#
# After applying this to the cluster, the controller creates a regular
# Secret named "vigil-secrets" in the "vigil" namespace. Install the chart
# with:
#   helm install vigil ./infra/helm/vigil -n vigil --create-namespace \
#     --set secrets.existingSecret=vigil-secrets
#
# Do NOT commit the plain Secret. This file is an illustration only — it
# won't decrypt against any real cluster because the values below are
# placeholders, not real ciphertext.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vigil-secrets
  namespace: vigil
spec:
  template:
    metadata:
      name: vigil-secrets
      namespace: vigil
    type: Opaque
  encryptedData:
    # All values are base64-encoded ciphertext produced by `kubeseal`.
    # The keys below are the minimum set for a working install. The chart
    # splits database access across three roles, so the Secret must carry
    # three distinct Postgres passwords: POSTGRES_PASSWORD (the owner
    # password), POSTGRES_APP_PASSWORD (the vigil_app password) and
    # POSTGRES_AGENT_PASSWORD (the vigil_agent password). All three must
    # differ from each other. AGENT_INTERNAL_TOKEN is required to run a
    # workflow (without it every /internal call answers 503), and
    # MCP_RUNNER_TOKEN / SHELL_TOKEN are required for the MCP runner /
    # agent shell to become ready. Add others (SPLUNK_PASSWORD,
    # SLACK_BOT_TOKEN, etc.) as your integrations require.
    ANTHROPIC_API_KEY:      AgB...replace-with-kubeseal-output...
    POSTGRES_PASSWORD:      AgB...replace-with-kubeseal-output...
    POSTGRES_APP_PASSWORD:  AgB...replace-with-kubeseal-output...
    POSTGRES_AGENT_PASSWORD: AgB...replace-with-kubeseal-output...
    JWT_SECRET_KEY:         AgB...replace-with-kubeseal-output...
    AGENT_INTERNAL_TOKEN:   AgB...replace-with-kubeseal-output...
    MCP_RUNNER_TOKEN:       AgB...replace-with-kubeseal-output...
    SHELL_TOKEN:            AgB...replace-with-kubeseal-output...

